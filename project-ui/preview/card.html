<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--paper-50); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 14px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .card {
    background: #fff;
    border: 1px solid var(--border-1);
    border-radius: var(--r-3);
    padding: 16px;
    box-shadow: var(--shadow-1);
  }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .name { font: 600 15px/1.25 var(--font-sans); color: var(--fg-1); }
  .meta { font: 400 12px/1.4 var(--font-mono); color: var(--fg-3); margin-top: 3px; letter-spacing: 0; }
  .badge { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; font:500 11px/1 var(--font-sans); border-radius: var(--r-pill); background: var(--mint-50); color: var(--mint-600);}
  .badge .dot { width:6px; height:6px; border-radius:999px; background: var(--mint-500); }
  .rowline { display: flex; justify-content: space-between; padding: 6px 0; font: 400 13px/1 var(--font-sans); color: var(--fg-2); border-top: 1px solid var(--border-hair); }
  .rowline:first-of-type { border-top: 0; }
  .rowline .k { color: var(--fg-3); }
  .rowline .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-1); }
</style></head>
<body>
  <h5>Card · patient summary</h5>
  <div class="grid">
    <div class="card">
      <div class="top">
        <div>
          <div class="name">Amelia Okoye</div>
          <div class="meta">34F · #A-4021 · Recall due</div>
        </div>
        <span class="badge"><span class="dot"></span>Confirmed</span>
      </div>
      <div class="rowline"><span class="k">Next visit</span><span class="v">Tue · 10:30</span></div>
      <div class="rowline"><span class="k">Provider</span><span class="v">Dr. Nia</span></div>
      <div class="rowline"><span class="k">Balance</span><span class="v">$ 184.00</span></div>
    </div>
    <div class="card">
      <div class="top">
        <div>
          <div class="name">Marcus Chen</div>
          <div class="meta">52M · #A-4022 · New patient</div>
        </div>
        <span class="badge" style="background:var(--amber-50);color:var(--amber-600)"><span class="dot" style="background:var(--amber-500)"></span>Pending</span>
      </div>
      <div class="rowline"><span class="k">Next visit</span><span class="v">Thu · 14:00</span></div>
      <div class="rowline"><span class="k">Provider</span><span class="v">Dr. Ravi</span></div>
      <div class="rowline"><span class="k">Balance</span><span class="v">— </span></div>
    </div>
  </div>
</body></html>
