<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 12px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .item { border-radius: var(--r-3); overflow: hidden; box-shadow: var(--shadow-hair); }
  .band { height: 60px; display: flex; align-items: flex-end; padding: 8px 12px; color: #fff; font: 500 12px/1 var(--font-sans); }
  .row { display: flex; }
  .tile { flex: 1; height: 22px; }
  .info { padding: 10px 12px; background: #fff; }
  .label { font: 500 12px/1 var(--font-sans); color: var(--fg-1); }
  .use { font: 400 11px/1.3 var(--font-sans); color: var(--fg-3); margin-top: 4px; }
  .val { font: 500 10px/1 var(--font-mono); color: var(--fg-4); margin-top: 6px; letter-spacing: 0; }
</style></head>
<body>
  <h5>Semantic status colors</h5>
  <div class="grid">
    <div class="item">
      <div class="band" style="background:var(--mint-500)">Success</div>
      <div class="row"><div class="tile" style="background:var(--mint-50)"></div><div class="tile" style="background:var(--mint-500)"></div><div class="tile" style="background:var(--mint-600)"></div></div>
      <div class="info"><div class="label">Mint</div><div class="use">Completed tx · Paid balance · Confirmed appt</div><div class="val">#2F8F51</div></div>
    </div>
    <div class="item">
      <div class="band" style="background:var(--amber-500)">Warning</div>
      <div class="row"><div class="tile" style="background:var(--amber-50)"></div><div class="tile" style="background:var(--amber-500)"></div><div class="tile" style="background:var(--amber-600)"></div></div>
      <div class="info"><div class="label">Amber</div><div class="use">Tx planned · Insurance pending · Recall due</div><div class="val">#C88A1E</div></div>
    </div>
    <div class="item">
      <div class="band" style="background:var(--coral-500)">Urgent</div>
      <div class="row"><div class="tile" style="background:var(--coral-50)"></div><div class="tile" style="background:var(--coral-500)"></div><div class="tile" style="background:var(--coral-600)"></div></div>
      <div class="info"><div class="label">Coral</div><div class="use">Overdue · Caries · Alert</div><div class="val">#C64A2E</div></div>
    </div>
    <div class="item">
      <div class="band" style="background:var(--slate-500)">Info</div>
      <div class="row"><div class="tile" style="background:var(--slate-50)"></div><div class="tile" style="background:var(--slate-500)"></div><div class="tile" style="background:var(--slate-600)"></div></div>
      <div class="info"><div class="label">Slate</div><div class="use">Existing resto · Note · Neutral info</div><div class="val">#4A6685</div></div>
    </div>
  </div>
</body></html>
