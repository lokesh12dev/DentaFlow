<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 6px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .subtitle { font: 400 12px/1.4 var(--font-sans); color: var(--fg-3); margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .item { padding: 12px; border-radius: var(--r-3); background: var(--paper-100); }
  .name { font: 500 12px/1 var(--font-mono); color: var(--fg-1); letter-spacing:0 }
  .val { font: 500 11px/1 var(--font-mono); color: var(--fg-4); margin-top: 4px; letter-spacing:0 }
  .use { font: 400 11px/1.4 var(--font-sans); color: var(--fg-3); margin-top: 8px; }
  .bar { margin-top: 10px; height: 4px; background: var(--paper-300); border-radius: 4px; overflow: hidden; position: relative; }
  .bar::after { content:""; position: absolute; top: 0; left: 0; width: 40%; height: 100%; background: var(--teal-500); border-radius: 4px; animation: run 2.4s var(--ease-standard) infinite; }
  @keyframes run { 0%{transform:translateX(-100%)} 60%{transform:translateX(160%)} 100%{transform:translateX(160%)} }
</style></head>
<body>
  <h5>Motion · quiet, precise, no bounce</h5>
  <div class="subtitle">Easing: cubic-bezier(0.2, 0, 0.1, 1). Never scale on hover — background overlay only.</div>
  <div class="grid">
    <div class="item"><div class="name">--dur-1</div><div class="val">120ms</div><div class="use">Hover state, tiny motion</div><div class="bar"></div></div>
    <div class="item"><div class="name">--dur-2</div><div class="val">180ms</div><div class="use">Buttons, chips, checkboxes</div><div class="bar" style="animation-duration:2.4s"></div></div>
    <div class="item"><div class="name">--dur-3</div><div class="val">260ms</div><div class="use">Panels, popovers, sheets</div><div class="bar"></div></div>
    <div class="item"><div class="name">--dur-4</div><div class="val">400ms</div><div class="use">Page-level, modals</div><div class="bar"></div></div>
  </div>
</body></html>
