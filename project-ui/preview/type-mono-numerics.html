<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 14px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .block h6 { margin: 0 0 8px; font: 500 11px/1 var(--font-mono); letter-spacing: 0; color: var(--fg-4); }
  .block .body { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-1); }
  .row { padding: 3px 0; }
  .subdued { color: var(--fg-3); }
</style></head>
<body>
  <h5>Mono · Geist Mono · tabular-nums</h5>
  <div class="grid">
    <div class="block">
      <h6>Tooth codes · FDI</h6>
      <div class="body" style="font-size:14px; line-height:1.7">
        <div class="row">11 · 12 · 13 · 14 · 15 · 16 · 17 · 18</div>
        <div class="row">21 · 22 · 23 · 24 · 25 · 26 · 27 · 28</div>
        <div class="row"><span class="subdued">Deciduous</span> 55 · 54 · 53 · 52 · 51</div>
      </div>
    </div>
    <div class="block">
      <h6>Currency · Times · IDs</h6>
      <div class="body" style="font-size:14px; line-height:1.7">
        <div class="row">$ 1,284.00</div>
        <div class="row">10:30 – 11:15 <span class="subdued">45 min</span></div>
        <div class="row">Rx#A-4021-8B <span class="subdued">D2392</span></div>
      </div>
    </div>
  </div>
</body></html>
