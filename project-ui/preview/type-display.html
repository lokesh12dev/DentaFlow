<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 24px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 18px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .row { display: flex; align-items: baseline; gap: 20px; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .spec { min-width: 160px; font: 500 11px/1 var(--font-mono); color: var(--fg-4); letter-spacing: 0; }
  .sample { flex: 1; color: var(--fg-1); }
</style></head>
<body>
  <h5>Display · Instrument Serif</h5>
  <div class="row">
    <div class="spec">Serif · 400 · 80/1.1</div>
    <div class="sample" style="font: 400 80px/1.1 var(--font-serif); letter-spacing: -0.02em;">Every tooth.</div>
  </div>
  <div class="row">
    <div class="spec">Serif · 400i · 56/1.1</div>
    <div class="sample" style="font: 400 italic 56px/1.1 var(--font-serif); letter-spacing: -0.02em;">One record.</div>
  </div>
  <div class="row">
    <div class="spec">Serif · 400 · 38/1.15</div>
    <div class="sample" style="font: 400 38px/1.15 var(--font-serif); letter-spacing: -0.015em;">Good morning, Dr. Nia.</div>
  </div>
</body></html>
