<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
  .sw { border-radius: var(--r-2); overflow: hidden; box-shadow: var(--shadow-hair); }
  .sw .chip { height: 74px; }
  .sw .meta { padding: 8px 8px 10px; background: #fff; }
  .name { font: 500 12px/1 var(--font-sans); color: var(--fg-1); }
  .val { font: 500 11px/1 var(--font-mono); color: var(--fg-3); margin-top: 4px; letter-spacing: 0; }
  h5 { margin: 0 0 12px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body>
  <h5>Enamel Teal · Primary</h5>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--teal-50)"></div><div class="meta"><div class="name">50</div><div class="val">#EAF4F2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-100)"></div><div class="meta"><div class="name">100</div><div class="val">#CFE5E0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-200)"></div><div class="meta"><div class="name">200</div><div class="val">#A5CFC7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-300)"></div><div class="meta"><div class="name">300</div><div class="val">#6FB0A5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-400)"></div><div class="meta"><div class="name">400</div><div class="val">#3E8F84</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-500);position:relative"><span style="position:absolute;top:6px;right:8px;font:500 10px/1 var(--font-mono);color:#FBF9F6;letter-spacing:.06em;text-transform:uppercase">Base</span></div><div class="meta"><div class="name">500</div><div class="val">#1F6E66</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="meta"><div class="name">600</div><div class="val">#185852</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-700)"></div><div class="meta"><div class="name">700</div><div class="val">#124540</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-900)"></div><div class="meta"><div class="name">900</div><div class="val">#071F1D</div></div></div>
  </div>
</body></html>
