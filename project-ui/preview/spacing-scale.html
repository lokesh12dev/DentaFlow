<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 14px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .row { display: flex; align-items: center; gap: 12px; padding: 3px 0; }
  .name { width: 80px; font: 500 12px/1 var(--font-mono); color: var(--fg-1); }
  .val { width: 60px; font: 500 11px/1 var(--font-mono); color: var(--fg-4); text-align: right; }
  .bar { height: 14px; background: var(--teal-500); border-radius: 2px; }
</style></head>
<body>
  <h5>Spacing scale · 4pt grid + 2pt half-step</h5>
  <div class="row"><div class="name">--sp-05</div><div class="val">2px</div><div class="bar" style="width:2px"></div></div>
  <div class="row"><div class="name">--sp-1</div><div class="val">4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">--sp-2</div><div class="val">8px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">--sp-3</div><div class="val">12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">--sp-4</div><div class="val">16px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">--sp-5</div><div class="val">20px</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="name">--sp-6</div><div class="val">24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">--sp-8</div><div class="val">32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">--sp-10</div><div class="val">40px</div><div class="bar" style="width:40px"></div></div>
  <div class="row"><div class="name">--sp-12</div><div class="val">48px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">--sp-16</div><div class="val">64px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">--sp-20</div><div class="val">80px</div><div class="bar" style="width:80px"></div></div>
</body></html>
