<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 12px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .subtitle { font: 400 12px/1.4 var(--font-sans); color: var(--fg-3); margin-bottom: 14px; max-width: 500px;}
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tooth { width: 44px; height: 54px; position: relative; }
  .tooth svg { width: 100%; height: 100%; }
  .lbl { font: 500 11px/1.2 var(--font-sans); color: var(--fg-1); text-align: center; }
  .code { font: 500 10px/1 var(--font-mono); color: var(--fg-3); letter-spacing: 0; }
</style></head>
<body>
  <h5>Dental chart · Clinical status</h5>
  <div class="subtitle">Domain-specific palette used only in the dental chart. Renders directly on tooth glyphs; independent from general semantic scale.</div>
  <div class="row">
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#6FB0A5" stroke="#4A8B7F" stroke-width="1"/></svg></div><div class="lbl">Healthy</div><div class="code">#6FB0A5</div></div>
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#F5F2EC" stroke="#CFC8BB" stroke-width="1"/><rect x="15" y="22" width="14" height="10" fill="#4A6685" rx="1"/></svg></div><div class="lbl">Restored</div><div class="code">#4A6685</div></div>
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#F5F2EC" stroke="#C88A1E" stroke-width="1.5" stroke-dasharray="3 2"/><rect x="15" y="22" width="14" height="10" fill="none" stroke="#C88A1E" stroke-width="1.5" stroke-dasharray="2 2" rx="1"/></svg></div><div class="lbl">Planned</div><div class="code">#C88A1E</div></div>
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#F5F2EC" stroke="#2F8F51" stroke-width="1"/><rect x="15" y="22" width="14" height="10" fill="#2F8F51" rx="1"/></svg></div><div class="lbl">Completed</div><div class="code">#2F8F51</div></div>
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#F5F2EC" stroke="#C64A2E" stroke-width="1"/><circle cx="30" cy="18" r="4" fill="#C64A2E"/></svg></div><div class="lbl">Caries</div><div class="code">#C64A2E</div></div>
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#F5F2EC" stroke="#B4B8C1" stroke-width="1" stroke-dasharray="2 2"/><line x1="10" y1="10" x2="34" y2="44" stroke="#B4B8C1" stroke-width="1.5"/><line x1="34" y1="10" x2="10" y2="44" stroke="#B4B8C1" stroke-width="1.5"/></svg></div><div class="lbl">Missing</div><div class="code">#B4B8C1</div></div>
    <div class="item"><div class="tooth"><svg viewBox="0 0 44 54"><path d="M22 3 C 31 3, 38 7, 40 15 C 41 22, 39 32, 36 40 C 34 45, 33 51, 31 51 C 29 51, 28 45, 25 41 C 23 44, 22 51, 20 51 C 18 51, 16 45, 13 40 C 9 32, 6 22, 8 15 C 10 7, 17 3, 22 3 Z" fill="#F5F2EC" stroke="#9B7BC9" stroke-width="1.5"/><text x="22" y="34" text-anchor="middle" font-family="Geist Mono, monospace" font-size="14" font-weight="500" fill="#9B7BC9">?</text></svg></div><div class="lbl">Watch</div><div class="code">#9B7BC9</div></div>
  </div>
</body></html>
