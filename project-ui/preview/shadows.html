<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--paper-50); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 22px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .row { display: flex; gap: 26px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card { width: 100px; height: 60px; background: #fff; border-radius: var(--r-3); }
  .name { font: 500 11px/1 var(--font-mono); color: var(--fg-1); }
  .use { font: 400 11px/1.2 var(--font-sans); color: var(--fg-3); text-align: center; }
</style></head>
<body>
  <h5>Elevation · warm-tinted shadows (never blue-gray)</h5>
  <div class="row">
    <div class="item"><div class="card" style="box-shadow:var(--shadow-hair)"></div><div class="name">hair</div><div class="use">Hairline separation</div></div>
    <div class="item"><div class="card" style="box-shadow:var(--shadow-1)"></div><div class="name">1</div><div class="use">Card default</div></div>
    <div class="item"><div class="card" style="box-shadow:var(--shadow-2)"></div><div class="name">2</div><div class="use">Raised card</div></div>
    <div class="item"><div class="card" style="box-shadow:var(--shadow-3)"></div><div class="name">3</div><div class="use">Popover<br/>Slide-in panel</div></div>
    <div class="item"><div class="card" style="box-shadow:var(--shadow-4)"></div><div class="name">4</div><div class="use">Modal</div></div>
    <div class="item"><div class="card" style="box-shadow:var(--shadow-focus); border:1px solid var(--teal-500)"></div><div class="name">focus</div><div class="use">Keyboard focus</div></div>
  </div>
</body></html>
