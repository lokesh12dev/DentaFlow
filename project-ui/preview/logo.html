<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-surface); font-family: var(--font-sans); color: var(--fg-1); }
  h5 { margin: 0 0 14px; font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 14px; }
  .plate { display: flex; align-items: center; justify-content: center; padding: 22px 12px; border-radius: var(--r-3); box-shadow: var(--shadow-hair); }
  .plate .cap { position: absolute; }
  .plate img { max-width: 100%; height: 40px; }
  .l1 { background: #fff; border: 1px solid var(--border-1); }
  .l2 { background: var(--paper-100); }
  .l3 { background: var(--ink-900); }
  .cap { margin-top: 6px; font: 500 10px/1 var(--font-mono); color: var(--fg-4); text-align: center; letter-spacing: 0; }
  .wrap { display: flex; flex-direction: column; align-items: center; }
</style></head>
<body>
  <h5>Wordmark &amp; mark</h5>
  <div class="grid">
    <div class="wrap"><div class="plate l1" style="width:100%; box-sizing:border-box"><img src="../assets/logo.svg" alt=""></div><div class="cap">logo.svg · on paper</div></div>
    <div class="wrap"><div class="plate l2" style="width:100%; box-sizing:border-box"><img src="../assets/logo-mark.svg" alt="" style="height:44px"></div><div class="cap">logo-mark.svg</div></div>
    <div class="wrap"><div class="plate l3" style="width:100%; box-sizing:border-box"><img src="../assets/logo-lockup-dark.svg" alt=""></div><div class="cap">logo-lockup-dark.svg</div></div>
  </div>
</body></html>
