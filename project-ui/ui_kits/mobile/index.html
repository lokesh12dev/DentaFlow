<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DentaFlow · Mobile</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; background: linear-gradient(135deg, #ECE7DC, #E1DCD1); font-family: var(--font-sans); }
    #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px; gap: 40px; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="mobilePrimitives.jsx"></script>
  <script type="text/babel" src="PhoneFrame.jsx"></script>
  <script type="text/babel" src="MobileTabBar.jsx"></script>
  <script type="text/babel" src="MobileTodayView.jsx"></script>
  <script type="text/babel" src="MobilePatientSheet.jsx"></script>
  <script type="text/babel" src="MobileVoiceNote.jsx"></script>
  <script type="text/babel" src="MobileApp.jsx"></script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(
      <PhoneFrame data-screen-label="Mobile · Today">
        <MobileApp />
      </PhoneFrame>
    );
  </script>
</body>
</html>
