<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DentaFlow · Clinical workspace</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--paper-50); font-family: var(--font-sans); color: var(--fg-1); -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; }
    /* Scrollbar tuning to match warm palette */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--paper-300); border-radius: 999px; border: 2px solid var(--paper-50); }
    ::-webkit-scrollbar-thumb:hover { background: var(--paper-400); }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="SideRail.jsx"></script>
  <script type="text/babel" src="ScheduleView.jsx"></script>
  <script type="text/babel" src="DentalChart.jsx"></script>
  <script type="text/babel" src="ChartView.jsx"></script>
  <script type="text/babel" src="CommandPalette.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [nav, setNav] = useState(() => localStorage.getItem('df.nav') || 'schedule');
      const [paletteOpen, setPaletteOpen] = useState(false);

      useEffect(() => { localStorage.setItem('df.nav', nav); }, [nav]);

      useEffect(() => {
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setPaletteOpen(true); }
          if (e.key === 'Escape') setPaletteOpen(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const handleSelectPatient = () => setNav('chart');

      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }} data-screen-label={`Web · ${nav}`}>
          <TopBar onOpenPalette={() => setPaletteOpen(true)} clinic="Riverside Dental · Downtown" />
          <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
            <SideRail current={nav} onChange={setNav} />
            <div style={{ flex: 1, minWidth: 0, overflow: 'hidden' }}>
              {nav === 'schedule' && <ScheduleView onSelectPatient={handleSelectPatient} />}
              {nav === 'chart' && <ChartView />}
              {nav !== 'schedule' && nav !== 'chart' && <EmptyView label={nav} onBack={() => setNav('schedule')} />}
            </div>
          </div>
          <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} onSelectPatient={handleSelectPatient} />
        </div>
      );
    }

    function EmptyView({ label, onBack }) {
      const LABELS = {
        patients:   { title: 'Patients',       body: 'Directory, quick-view cards, and cohort filters live here.' },
        messages:   { title: 'Messages',       body: 'Two-way SMS, email threads, and voicemail with auto-transcription.' },
        billing:    { title: 'Billing',        body: 'Claims, receipts, statements, aging reports.' },
        lab:        { title: 'Lab cases',      body: 'Case tracking, shipping labels, and pickups.' },
        inventory:  { title: 'Inventory',      body: 'Consumable tracking, PAR levels, reorder rules.' },
        automations:{ title: 'Automations',    body: 'Recall cadences, insurance chases, review requests.' },
        settings:   { title: 'Settings',       body: 'Clinic profile, providers, chairs, fees, integrations.' },
      };
      const l = LABELS[label] || { title: label, body: '' };
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, background: 'var(--paper-50)' }}>
          <div style={{ fontFamily: 'var(--font-serif)', fontSize: 40, letterSpacing: '-0.02em', color: 'var(--fg-1)' }}>{l.title}</div>
          <div style={{ fontFamily: 'var(--font-sans)', fontSize: 14, color: 'var(--fg-3)', maxWidth: 400, textAlign: 'center', lineHeight: 1.5 }}>{l.body}</div>
          <Button variant="secondary" size="sm" onClick={onBack} icon="arrowRight">Back to schedule</Button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
